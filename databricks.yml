# This is a Declarative Automation Bundle definition for databricks_edu.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_edu
  uuid: 320e5c6d-1a11-41d1-b325-63ba1f5bab26

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  group_name:
    description: 
  sp_id :
     description:    

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
#https://github.com/sangmin-sl/databricks_edu.git

    git: 
      origin_url: https://github.com/sangmin-sl/databricks_edu.git
      branch : main

    workspace:
      host: https://dbc-440f1d22-290f.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
      group_name: data-engineer
      sp_id : 21be6765-f82d-4cfa-b203-8c3216e53e57



  prod:
    mode: production

    git:
      origin_url: https://github.com/sangmin-sl/databricks_edu.git
      branch: main

    workspace:
      host: https://dbc-e94c9eea-8073.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/21be6765-f82d-4cfa-b203-8c3216e53e57 to make sure we only have a single copy.
      root_path: /Workspace/Users/d1185284-4f87-4c40-9e68-ddb31350c87e/.bundle/mini/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
      group_name:  data-engineer
      sp_id: dosed79c1263fff09cfaa94dc5ad58799130
    permissions:
      - service_principal_name: d1185284-4f87-4c40-9e68-ddb31350c87e
        level: CAN_MANAGE

resources:
  jobs:
    job_exchange_rate:
      name: job_exchange_rate
      git_source:
        git_url: https://github.com/sangmin-sl/databricks_edu.git
        git_provider: gitHub
        git_branch: main


      tasks:
        - task_key: exchange_rate_get
          notebook_task:
            notebook_path: src/job_exchange_rate/create_table_exchange_rate
            source: GIT
      queue:
        enabled: true
      parameters:
        - name: search_date
          default: "{{job.start_time.iso_date}}"
      run_as:
        service_principal_name: 21be6765-f82d-4cfa-b203-8c3216e53e57
      performance_target: PERFORMANCE_OPTIMIZED
